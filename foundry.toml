[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["V52EvidenceRegistry"]
fs_permissions = [{ access = "read", path = "./deployments" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
quote_style = "double"

[rpc_endpoints]
hsk_testnet = "https://testnet.hsk.xyz"
hsk_mainnet = "${HSK_MAINNET_RPC_URL}"

[etherscan]
# HSK does not run a Etherscan-compatible verifier at buildathon time.
# Kept empty on purpose; verify manually against the Blockscout instance
# documented in README.md until an API key/endpoint is confirmed.
